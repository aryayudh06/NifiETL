global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nifi'
    scheme: https
    metrics_path: /nifi-api/flow/metrics/prometheus
    static_configs:
      - targets: ['localhost:8443']
    tls_config:
      insecure_skip_verify: true
    authorization:
      type: Bearer
      credentials: "eyJraWQiOiI3M2RjMjMzNy01ZGRhLTRiNzgtYjJjOS03YTgzMTUzOWYwODAiLCJhbGciOiJFZERTQSJ9..of-KrTmEH4sbK4I06c1QxxOdJrZF4PcTV9k7XxZIY9LU3O07Ii32pSwuNgL5pTqUnI-SuRKoNGpT8Ns_n59xCw"
  
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
  
  - job_name: 'statsd'
    static_configs:
      - targets: ['statsd-exporter:9102']